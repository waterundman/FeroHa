[package]
name = "feroha-cli"
version = "2.14.2"
edition = "2021"

[dependencies]
feroha_lib = { path = "../src-tauri", package = "feroha" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
